name: crm-detailing-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data
    networks: [backend]

  web:
    build: .
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3} --timeout 60
      --access-logfile - --error-logfile -"
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -B -l INFO --schedule /tmp/crm-celerybeat-schedule
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_healthy}
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:?TLS_ASK_TOKEN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
