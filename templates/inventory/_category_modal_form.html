<div class="modal-head"><div><span class="eyebrow">Расходники</span><h2>{{ title }}</h2><p>После сохранения категория выберется автоматически</p></div><button class="modal-close" type="button" data-modal-close>×</button></div>
<form class="modal-form" method="post" action="{% url 'inventory-category-create' %}?modal=1">{% csrf_token %}<div class="form-grid">{% for field in form %}<div class="field{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">{{ field.label_tag }}{{ field }}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</div>{% endfor %}</div><div class="form-actions"><button class="button primary" type="submit">Сохранить категорию</button><button class="button ghost" type="button" data-modal-close>Отмена</button></div></form>
