{% load crm_numbers %}<form class="inline-stock-form" method="post" action="{% url 'consumable-fact-update' item.id %}" data-inline-stock>{% csrf_token %}<span class="inline-stock-value" data-stock-value>{{ item.actual_stock|trim_decimal }}</span><input type="text" inputmode="decimal" name="actual_stock" value="{{ item.actual_stock|trim_decimal }}" aria-label="Фактический остаток {{ item.name }}"><span>{{ item.unit_display }}</span><button type="submit" aria-label="Сохранить фактический остаток">✓</button><small data-stock-error></small></form>
