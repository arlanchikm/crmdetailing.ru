<label class="date-range-field">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="M7 14h1M12 14h1M7 17h1"/></svg>
  {% if field %}{{ field }}{% else %}<input type="date" name="{{ name }}" value="{{ value|date:'Y-m-d' }}" aria-label="{{ label }}"{% if required %} required{% endif %}>{% endif %}
  <span class="date-range-value" aria-hidden="true"></span>
</label>
