<section class="auth-card"><h1>Подтверждение входа</h1><p>Введите код из письма на {{ email }}. Код действует 10 минут. Можно использовать один из сохранённых резервных кодов.</p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="login-code">Код из письма или резервный код</label><input id="login-code" name="code" autocomplete="one-time-code" required maxlength="20" autofocus></div><button class="button primary" type="submit">Подтвердить вход</button></form><div class="form-actions"><form method="post">{% csrf_token %}<input type="hidden" name="action" value="resend"><button class="button secondary">Отправить повторно</button></form><a class="button secondary" href="{{ login_url }}">Войти заново</a></div></section>
