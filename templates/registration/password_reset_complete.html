{% extends "base.html" %}
{% block title %}Пароль изменён — {{ current_tenant.name }}{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">{{ current_tenant.name }}</p>
  <h1>Пароль изменён</h1>
  <p class="auth-note">Теперь можно войти с новым паролем.</p>
  <div class="auth-secondary-actions"><a class="primary-button" href="{% url 'login' %}">Войти</a></div>
</section>
{% endblock %}
