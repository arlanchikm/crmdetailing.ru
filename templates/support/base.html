{% load static %}<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}База знаний — CRM Detailing{% endblock %}</title><meta name="description" content="{% block description %}Инструкции CRM Detailing: записи, клиенты, услуги, команда, расходники, касса и онлайн-запись.{% endblock %}"><link rel="icon" href="{% static 'img/crm-logo-96-20261007.webp' %}"><link rel="stylesheet" href="{% static 'css/support.css' %}?v=20261007-1"><link rel="canonical" href="https://{{ support_domain }}{{ request.path }}">{% block head %}{% endblock %}</head>
